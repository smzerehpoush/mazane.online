# فقط برای اجرای محلی — تست‌ها به هیچ سرویس زنده‌ای وابسته نیستند
# (لایه‌ی ذخیره پشت اینترفیس است و تست‌ها فیک درون‌حافظه‌ای می‌گیرند).
#
# اجرا:  docker compose -f docker-compose.dev.yml up -d
# مهاجرت 001 در اولین بوت پستگرس خودکار اجرا می‌شود.

services:
  postgres:
    image: postgres:16
    environment:
      # کاربر/دیتابیس عمداً «mazane» مانده‌اند (تغییر نام ۲۰۲۶-۰۸-۱۰): volume
      # موجود با همین نام‌ها ساخته شده و عوض‌کردنشان یعنی اتصال به دیتابیسی
      # که وجود ندارد. نام برند و بقیه‌ی شناسه‌ها تابلو شده‌اند.
      POSTGRES_USER: mazane
      POSTGRES_PASSWORD: mazane
      POSTGRES_DB: mazane
    ports:
      - "5432:5432"
    volumes:
      - mazane-postgres-data:/var/lib/postgresql/data
      - ./collector/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mazane-postgres-data:
