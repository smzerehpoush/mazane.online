# Tablo CI (ticket 11)
#
# Two test/typecheck jobs on every push and PR; the image-build job only on
# push to main. Image builds happen "only" here or on a laptop — never on the
# 1-core/2GB server (architecture doc section 13, decision 5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    name: collector (pytest + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Typecheck
        run: mypy src tests

  web:
    name: web (vite build + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same base version as Dockerfile.web — a Node version mismatch
          # between CI and the image means green CI and a red production.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Build first: besides producing the image, it also regenerates
      # `src/routeTree.gen.ts`, so the typecheck that follows sees the fresh
      # route tree, not the committed one.
      - name: Build
        run: npm run build

      # Preset gate: the output must be a Node server, not a Cloudflare Worker.
      # The same check also lives inside Dockerfile.web; it's here too so the
      # error shows up in the PR, not in the image-build job that only runs
      # on main.
      - name: Nitro preset must be node-server
        run: |
          grep -q '"preset": "node-server"' .output/nitro.json || {
            echo "::error::پریست nitro برابر node-server نیست — web/vite.config.ts را ببینید"
            cat .output/nitro.json
            exit 1
          }

      # The font must stay self-hosted. Any regression back to Google Fonts
      # servers means the site gets slow/broken for Iranian users and an
      # external dependency comes back (ticket 11). The grep runs on the
      # build output, not just the source, so it can't sneak back in through
      # a package either. The pattern needs `//`, so it only matches the real
      # URL and a comment that mentions the hostname explanatorily doesn't
      # false-positive.
      - name: No external font host in the build output
        run: |
          if grep -rIlE "//fonts\.(googleapis|gstatic)\.com" .output/public src; then
            echo "::error::ارجاع به فونت گوگل پیدا شد — فونت باید از public/fonts سرو شود"
            exit 1
          fi

      # Contracts hard rule 6: the client bundle carries no trace of
      # admin-panel auth/session logic (ticket 20). The grep runs on the
      # build output so it can't sneak back in through a wrong import either
      # — not just the source.
      - name: No admin-auth secrets in the client bundle
        run: |
          if grep -rIlE "scryptSync|TABLO_ADMIN_PASSWORD_HASH|TABLO_ADMIN_SESSION_SECRET|tablo_admin_session" .output/public; then
            echo "::error::ردی از منطق/env احراز هویت پنل در باندل کلاینت پیدا شد"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Includes the sponsored-links guard test (tests/sponsored-links.test.tsx):
      # contracts hard rule 7 — every outbound monetized link must go through
      # /go/<slug> and carry rel="sponsored nofollow noopener". This gate must
      # never be softened; if it's red, fix the test, don't remove it.
      - name: Tests
        run: npm test

  images:
    name: docker images (build + smoke test)
    # main only: building images for PRs costs money and the output isn't used.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [collector, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # push: false — intentional. Choosing a registry is the business
      # owner's decision (ops/RUNBOOK.md, prerequisite 2; recommendation: GHCR
      # + `docker compose pull`, with `docker save | ssh docker load` as a
      # fallback path if GHCR isn't reachable from Iran). Once decided: add
      # login + push: true + tagging.
      - name: Build collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          platforms: linux/amd64
          push: false
          tags: tablo-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max

      # `load: true` so the image stays in the runner's daemon and we can
      # actually run it.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: false
          load: true
          tags: tablo-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Real smoke test: bring the container up "without Redis and without
      # Postgres". We expect 200, not 500 — hard rule 5: a source outage is
      # staleness, not an error. Same memory cap as compose.prod.yml so it
      # shows up here if the image gets heavy.
      - name: Smoke test the web image
        run: |
          docker run -d --name tablo-web-ci \
            --memory 256m --cpus 0.5 \
            -p 127.0.0.1:3000:3000 tablo-web:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET / -> $code"
          [ "$code" = "200" ] || { docker logs tablo-web-ci; exit 1; }
          # The filename is read from the repo itself, not hardcoded — a font
          # version bump shouldn't break CI with a confusing message.
          fontfile=$(basename web/public/fonts/*.woff2)
          font=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:3000/fonts/$fontfile")
          echo "GET /fonts/$fontfile -> $font"
          [ "$font" = "200" ] || { echo "::error::فونت خودمیزبان سرو نشد"; exit 1; }
          docker inspect --format 'OOMKilled={{.State.OOMKilled}}' tablo-web-ci

      - name: Stop smoke container
        if: always()
        run: docker rm -f tablo-web-ci || true
