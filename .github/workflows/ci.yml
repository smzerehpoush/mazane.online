# CI مظنه آنلاین (بلیت ۱۱)
#
# دو جاب تست/تایپ‌چک روی هر push و PR؛ جاب ساخت ایمیج فقط روی push به main.
# ساخت ایمیج «فقط» همین‌جا یا روی لپ‌تاپ انجام می‌شود — هرگز روی سرورِ
# ۱ هسته/۲GB (بند ۱۳ سند معماری، تصمیم ۵).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    name: collector (pytest + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Typecheck
        run: mypy src tests

  web:
    name: web (vite build + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # همان نسخه‌ی پایه‌ی Dockerfile.web — تفاوت نسخه‌ی نود بین CI و ایمیج
          # یعنی CI سبز و تولید قرمز.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # اول build: علاوه بر ساخت ایمیج، `src/routeTree.gen.ts` را هم بازتولید
      # می‌کند، پس تایپ‌چک بعدی درخت مسیرِ تازه را می‌بیند نه نسخه‌ی کامیت‌شده.
      - name: Build
        run: npm run build

      # دروازه‌ی پریست: خروجی باید سرور نود باشد، نه Cloudflare Worker.
      # همین چک داخل Dockerfile.web هم هست؛ اینجا هست تا خطا در PR دیده شود
      # نه در جاب ساخت ایمیج که فقط روی main اجرا می‌شود.
      - name: Nitro preset must be node-server
        run: |
          grep -q '"preset": "node-server"' .output/nitro.json || {
            echo "::error::پریست nitro برابر node-server نیست — web/vite.config.ts را ببینید"
            cat .output/nitro.json
            exit 1
          }

      # فونت باید خودمیزبان بماند. هر بازگشت به سرورهای فونت گوگل یعنی سایت
      # برای کاربر ایرانی کند/شکسته می‌شود و یک وابستگی بیرونی برمی‌گردد
      # (بلیت ۱۱). گرپ روی خروجی بیلد است نه فقط منبع، تا از راه یک بسته هم
      # برنگردد. الگو ‎//‎ را لازم دارد، پس فقط نشانی واقعی را می‌گیرد و
      # کامنتی که نام میزبان را توضیحی آورده false-positive نمی‌شود.
      - name: No external font host in the build output
        run: |
          if grep -rIlE "//fonts\.(googleapis|gstatic)\.com" .output/public src; then
            echo "::error::ارجاع به فونت گوگل پیدا شد — فونت باید از public/fonts سرو شود"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # شامل تست نگهبان لینک‌های درآمدزا (tests/sponsored-links.test.tsx):
      # قاعده‌ی سخت ۷ قراردادها — هر لینک خروجی درآمدزا باید از /go/<slug> برود
      # و rel="sponsored nofollow noopener" داشته باشد. این دروازه هرگز نباید
      # نرم شود؛ اگر قرمز است باید تست درست شود، نه حذف.
      - name: Tests
        run: npm test

  images:
    name: docker images (build + smoke test)
    # فقط main: ساخت ایمیج برای PR ها هزینه دارد و خروجی‌اش مصرف نمی‌شود.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [collector, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # push: false — عمداً. انتخاب رجیستری تصمیم صاحب کسب‌وکار است
      # (ops/RUNBOOK.md، پیش‌نیاز ۲؛ توصیه: GHCR + ‎docker compose pull‎،
      # با مسیر جایگزین ‎docker save | ssh docker load‎ اگر GHCR از ایران در
      # دسترس نبود). بعد از تصمیم: login + push: true + تگ‌گذاری اضافه شود.
      - name: Build collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          platforms: linux/amd64
          push: false
          tags: mazane-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max

      # ‎load: true‎ تا ایمیج در دیمن رانر بماند و بتوانیم واقعاً اجرایش کنیم.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: false
          load: true
          tags: mazane-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # دود-تست واقعی: کانتینر را «بدون ردیس و بدون پستگرس» بالا می‌آوریم.
      # انتظار ۲۰۰ است، نه ۵۰۰ — قاعده‌ی سخت ۵: قطع منبع کهنگی است نه خطا.
      # سقف حافظه همان compose.prod.yml تا اگر ایمیج سنگین شد اینجا لو برود.
      - name: Smoke test the web image
        run: |
          docker run -d --name mazane-web-ci \
            --memory 256m --cpus 0.5 \
            -p 127.0.0.1:3000:3000 mazane-web:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET / -> $code"
          [ "$code" = "200" ] || { docker logs mazane-web-ci; exit 1; }
          # نام فایل از خود مخزن خوانده می‌شود، نه hardcode — ارتقای نسخه‌ی
          # فونت نباید CI را با پیام گیج‌کننده بشکند.
          fontfile=$(basename web/public/fonts/*.woff2)
          font=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:3000/fonts/$fontfile")
          echo "GET /fonts/$fontfile -> $font"
          [ "$font" = "200" ] || { echo "::error::فونت خودمیزبان سرو نشد"; exit 1; }
          docker inspect --format 'OOMKilled={{.State.OOMKilled}}' mazane-web-ci

      - name: Stop smoke container
        if: always()
        run: docker rm -f mazane-web-ci || true
