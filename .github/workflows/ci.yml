# CI مظنه آنلاین (بلیت ۱۱)
#
# دو جاب تست/تایپ‌چک روی هر push و PR؛ جاب ساخت ایمیج فقط روی push به main.
# ساخت ایمیج «فقط» همین‌جا یا روی لپ‌تاپ انجام می‌شود — هرگز روی سرورِ
# ۱ هسته/۲GB (بند ۱۳ سند معماری، تصمیم ۵).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    name: collector (pytest + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Typecheck
        run: mypy src tests

  web:
    name: web (vitest + tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      # تایپ‌چک بعد از build تا ‎.next/types‎ (که tsconfig include اش کرده)
      # موجود باشد و تایپ‌های تولیدی مسیرها هم چک شوند.
      - name: Typecheck
        run: npm run typecheck

  images:
    name: docker images (build only)
    # فقط main: ساخت ایمیج برای PR ها هزینه دارد و خروجی‌اش مصرف نمی‌شود.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [collector, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # push: false — عمداً. انتخاب رجیستری تصمیم صاحب کسب‌وکار است
      # (ops/RUNBOOK.md، پیش‌نیاز ۲؛ توصیه: GHCR + ‎docker compose pull‎،
      # با مسیر جایگزین ‎docker save | ssh docker load‎ اگر GHCR از ایران در
      # دسترس نبود). بعد از تصمیم: login + push: true + تگ‌گذاری اضافه شود.
      - name: Build collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          platforms: linux/amd64
          push: false
          tags: mazane-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: false
          tags: mazane-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
