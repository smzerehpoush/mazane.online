# compose.prod.yml — production deployment of Tablo on the shared server (ticket 11)
#
#   docker compose -f compose.prod.yml up -d
#
# Server reality (architecture doc section 13, decision 5): Ubuntu 24.04, "1
# core, 2GB RAM" (~1.2GB free), ~8GB free disk, and 11 Padelyar containers are
# already running on it; Padelyar's edge Caddy holds ports 80/443. Consequences:
#   - Tablo "never" binds to 80/443; web is only published on 127.0.0.1 and the
#     existing Caddy reverse-proxies to it over the external tablo-edge network
#     (ops/caddy-snippet.Caddyfile + the runbook).
#   - Resource limits are deliberately conservative: the sum of the four
#     services' memory limits ≈ 864MB so Padelyar doesn't get starved; the CPU
#     limit is soft (adds up to more than 1 because it's a limit, not a
#     reservation — not everything peaks at the same time).
#   - Images are built outside the server (CI/laptop); this file only runs them.
#
# Configuration comes from the .env file next to this file (example: .env.example).

name: tablo

# Log cap for all services. The server has only ~8GB of free disk and the
# default json-file driver is **uncapped**: a source that disconnects and
# writes a connection error every few milliseconds fills the disk in one
# night, and then Padelyar goes down too. 30MB per service (3×10MB) is enough
# for troubleshooting.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Deliberately left at "mazane" as the default: the user/database inside
      # the existing volume is exactly this, and changing the default would
      # mean connecting to a database that doesn't exist. The real value
      # comes from the server's .env regardless.
      POSTGRES_USER: ${POSTGRES_USER:-mazane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env مقدار بدهید}
      POSTGRES_DB: ${POSTGRES_DB:-mazane}
    # Tuning for a low-RAM host: the default shared_buffers=128MB is
    # excessive for this server; our load is a few INSERTs per 30 seconds
    # plus a few light SELECTs.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Same pattern as docker-compose.dev.yml: on the "first" boot of an
      # empty volume, Postgres runs every *.sql file in lexicographic order
      # (001 through 012). For an already-initialized volume, new migrations
      # are run by hand (runbook, "migrations" step) — a read-only mount
      # keeps this simple.
      - ./collector/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mazane} -d $${POSTGRES_DB:-mazane}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    # Why these flags (2GB shared host):
    #   --maxmemory 64mb + allkeys-lru: Redis's entire dataset is a few
    #     hundred small keys (current price/listing/references — architecture
    #     doc section 3); it never hits the cap under normal operation. The
    #     cap + LRU is a "safety valve" — if a bug ever generates keys, Redis
    #     evicts the oldest ones instead of eating the shared host's RAM.
    #   --save "" --appendonly no: persistence isn't needed — the collector
    #     rewrites everything every 30 seconds; Redis going down just means
    #     at most one round of staleness. Turning off snapshotting also
    #     avoids the fork and the memory-usage spike that comes with it.
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  collector:
    # The image is built outside the server; its reference comes from .env
    # (GHCR or a loaded image — registry decision in the runbook, prerequisite 2).
    image: ${TABLO_IMAGE_COLLECTOR:-ghcr.io/smzerehpoush/tablo-collector:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TABLO_REDIS_URL: redis://redis:6379/0
      TABLO_DATABASE_URL: postgresql://${POSTGRES_USER:-mazane}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mazane}
      TABLO_REVALIDATE_URL: http://web:3000/api/revalidate-blog
      TABLO_REVALIDATE_TOKEN: ${TABLO_REVALIDATE_TOKEN:?TABLO_REVALIDATE_TOKEN را در .env مقدار بدهید}
      TABLO_DAILY_PUBLISH_CAP: ${TABLO_DAILY_PUBLISH_CAP:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Needs outbound internet access (crawling the platforms) — so
    # networks.internal:true is "not" set; just the default bridge driver
    # with no port published.
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  web:
    image: ${TABLO_IMAGE_WEB:-ghcr.io/smzerehpoush/tablo-web:latest}
    # Fixed name so Padelyar's edge Caddy can resolve it by this exact DNS
    # name on the tablo-edge network: reverse_proxy tablo-web:3000
    # (ops/caddy-snippet.Caddyfile).
    container_name: tablo-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      TABLO_REDIS_URL: redis://redis:6379/0
      TABLO_DATABASE_URL: postgresql://${POSTGRES_USER:-mazane}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mazane}
      TABLO_REVALIDATE_TOKEN: ${TABLO_REVALIDATE_TOKEN:?}
      # Admin panel (ticket 20) — the password hash, not the password itself;
      # generated per the runbook (1.4).
      TABLO_ADMIN_PASSWORD_HASH: ${TABLO_ADMIN_PASSWORD_HASH:?TABLO_ADMIN_PASSWORD_HASH را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ADMIN_SESSION_SECRET: ${TABLO_ADMIN_SESSION_SECRET:?TABLO_ADMIN_SESSION_SECRET را در .env مقدار بدهید — رانبوک بند ۱.۴}
      # Post cover image storage, ArvanCloud S3-compatible (ticket 24) — runbook section 1.4.
      # Without these, requiredEnv in image-store.ts throws and image upload
      # fails with a 502; only REGION has a default in code, the rest are required.
      TABLO_ARVAN_S3_ENDPOINT: ${TABLO_ARVAN_S3_ENDPOINT:?TABLO_ARVAN_S3_ENDPOINT را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_REGION: ${TABLO_ARVAN_S3_REGION:-default}
      TABLO_ARVAN_S3_BUCKET: ${TABLO_ARVAN_S3_BUCKET:?TABLO_ARVAN_S3_BUCKET را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_ACCESS_KEY: ${TABLO_ARVAN_S3_ACCESS_KEY:?TABLO_ARVAN_S3_ACCESS_KEY را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_SECRET_KEY: ${TABLO_ARVAN_S3_SECRET_KEY:?TABLO_ARVAN_S3_SECRET_KEY را در .env مقدار بدهید — رانبوک بند ۱.۴}
    # Host loopback only — for verification from the server itself (curl 127.0.0.1:3300).
    # Tablo doesn't bind to 80/443; real traffic comes from the edge Caddy on
    # the tablo-edge network, not through this port. (Caddy connecting to the
    # host loopback from inside the container isn't possible — that's why the
    # shared external network is needed; runbook, Caddy step.)
    ports:
      - "127.0.0.1:${TABLO_WEB_PORT:-3300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # 384M ← 256M: the web layer is no longer Next.js, it's a TanStack
          # Start + Nitro app and the .output build comes up lighter.
          # Measured for real on this same image: 31MB idle, 61MB after 200
          # SSR requests. This number is paired with
          # NODE_OPTIONS=--max-old-space-size=192 in Dockerfile.web — if one
          # changes, the other must too.
          memory: 256M

networks:
  internal:
    driver: bridge
  # Network shared with Padelyar's edge Caddy; must be created and the Caddy
  # container connected to it before up:
  #   docker network create tablo-edge
  #   docker network connect tablo-edge <Padelyar Caddy container name>
  edge:
    external: true
    name: tablo-edge

volumes:
  # ⚠️ The volume's real name is deliberately pinned to
  # "mazane_mazane-postgres-data" — the exact one created before the project
  # rename (2026-08-10). Without this pin, changing the project's `name:`
  # sends Docker to a **fresh, empty** volume instead, and the production
  # database looks like it's been wiped.
  #
  # Before the first deployment after the rename, verify this on the server:
  #   docker volume ls | grep postgres-data
  # If the real name is something else, fix it right here — don't remove the pin.
  postgres-data:
    name: mazane_mazane-postgres-data
