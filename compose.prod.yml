# compose.prod.yml — استقرار تولید تابلو روی سرور اشتراکی (بلیت ۱۱)
#
#   docker compose -f compose.prod.yml up -d
#
# واقعیت سرور (بند ۱۳ سند معماری، تصمیم ۵): اوبونتو ۲۴.۰۴، «۱ هسته، ۲GB رم»
# (~۱٫۲GB آزاد)، ~۸GB دیسک آزاد، و ۱۱ کانتینر پادل‌یار همین حالا روی آن است؛
# کدیِ لبه‌ی پادل‌یار درگاه‌های ۸۰/۴۴۳ را گرفته. پیامدها:
#   - مظنه «هرگز» ۸۰/۴۴۳ را نمی‌گیرد؛ وب فقط روی 127.0.0.1 منتشر می‌شود و
#     کدیِ موجود از طریق شبکه‌ی خارجی tablo-edge به آن reverse_proxy می‌کند
#     (ops/caddy-snippet.Caddyfile + رانبوک).
#   - سقف‌های منابع عمداً محافظه‌کارند: جمع سقف حافظه‌ی چهار سرویس ≈ 864MB تا
#     پادل‌یار خفه نشود؛ سقف CPU نرم است (بالاتر از ۱ جمع می‌شود چون سقف است
#     نه رزرو — همه هم‌زمان peak نمی‌کنند).
#   - ایمیج‌ها بیرون از سرور ساخته می‌شوند (CI/لپ‌تاپ)؛ این فایل فقط اجرا می‌کند.
#
# پیکربندی از فایل ‎.env‎ کنار همین فایل می‌آید (نمونه: ‎.env.example‎).

name: tablo

# سقف لاگ برای همه‌ی سرویس‌ها. سرور فقط ~۸GB دیسک آزاد دارد و درایور پیش‌فرض
# ‎json-file‎ **بی‌سقف** است: یک منبعِ قطع‌شده که هر چند میلی‌ثانیه خطای اتصال
# می‌نویسد، در یک شب دیسک را پر می‌کند و آن‌وقت پادل‌یار هم می‌خوابد.
# ۳۰MB برای هر سرویس (۳×۱۰MB) برای عیب‌یابی کافی است.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      # پیش‌فرض عمداً «mazane» مانده: کاربر/دیتابیسِ داخل volumeِ موجود همین
      # است و عوض‌کردن پیش‌فرض یعنی اتصال به دیتابیسی که وجود ندارد. مقدار
      # واقعی هرحال از ‎.env‎ سرور می‌آید.
      POSTGRES_USER: ${POSTGRES_USER:-mazane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env مقدار بدهید}
      POSTGRES_DB: ${POSTGRES_DB:-mazane}
    # تنظیم برای میزبان کم‌رم: پیش‌فرض shared_buffers=128MB برای این سرور
    # زیاده‌روی است؛ بار ما چند INSERT در ۳۰ ثانیه + چند SELECT سبک است.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # همان الگوی docker-compose.dev.yml: در «اولین» بوتِ volume خالی،
      # پستگرس همه‌ی ‎*.sql‎ها را به ترتیب واژه‌نگاری (001 تا 012) اجرا
      # می‌کند. برای volume از قبل مقداردهی‌شده، مهاجرت‌های جدید دستی اجرا
      # می‌شوند (رانبوک، گام «مهاجرت‌ها») — mount خواندنی همین را ساده می‌کند.
      - ./collector/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mazane} -d $${POSTGRES_DB:-mazane}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    # چرا این پرچم‌ها (میزبان ۲GB اشتراکی):
    #   --maxmemory 64mb + allkeys-lru: کل داده‌ی ردیس چند صد کلید کوچک است
    #     (قیمت جاری/فهرست/مراجع — بند ۳ سند معماری)؛ در کار عادی هرگز به سقف
    #     نمی‌رسد. سقف + LRU «سوپاپ اطمینان» است: اگر باگی کلید تولید کند،
    #     ردیس قدیمی‌ترین‌ها را می‌اندازد به‌جای اینکه رم میزبان مشترک را بخورد.
    #   --save "" --appendonly no: ماندگاری لازم نیست — گردآورنده هر ۳۰ ثانیه
    #     همه‌چیز را بازمی‌نویسد؛ خاموشی ردیس فقط یعنی حداکثر یک نوبت کهنگی.
    #     خاموش‌کردن snapshot از fork و جهش مصرف حافظه هم جلوگیری می‌کند.
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  collector:
    # ایمیج بیرون از سرور ساخته می‌شود؛ مرجعش از ‎.env‎ می‌آید (GHCR یا ایمیج
    # load شده — تصمیم رجیستری در رانبوک، پیش‌نیاز ۲).
    image: ${TABLO_IMAGE_COLLECTOR:-ghcr.io/smzerehpoush/tablo-collector:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TABLO_REDIS_URL: redis://redis:6379/0
      TABLO_DATABASE_URL: postgresql://${POSTGRES_USER:-mazane}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mazane}
      TABLO_REVALIDATE_URL: http://web:3000/api/revalidate-blog
      TABLO_REVALIDATE_TOKEN: ${TABLO_REVALIDATE_TOKEN:?TABLO_REVALIDATE_TOKEN را در .env مقدار بدهید}
      TABLO_DAILY_PUBLISH_CAP: ${TABLO_DAILY_PUBLISH_CAP:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # به اینترنت بیرون نیاز دارد (کرال سکوها) — پس شبکه internal:true «نیست»؛
    # فقط drivers پیش‌فرض bridge بدون انتشار هیچ درگاهی.
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  web:
    image: ${TABLO_IMAGE_WEB:-ghcr.io/smzerehpoush/tablo-web:latest}
    # نام ثابت تا کدیِ لبه‌ی پادل‌یار روی شبکه‌ی tablo-edge با همین نام
    # DNS-اش کند: ‎reverse_proxy tablo-web:3000‎ (ops/caddy-snippet.Caddyfile).
    container_name: tablo-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      TABLO_REDIS_URL: redis://redis:6379/0
      TABLO_DATABASE_URL: postgresql://${POSTGRES_USER:-mazane}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mazane}
      TABLO_REVALIDATE_TOKEN: ${TABLO_REVALIDATE_TOKEN:?}
      # پنل مدیریت (بلیت ۲۰) — هش رمز، نه خودِ رمز؛ تولیدش در رانبوک (۱.۴).
      TABLO_ADMIN_PASSWORD_HASH: ${TABLO_ADMIN_PASSWORD_HASH:?TABLO_ADMIN_PASSWORD_HASH را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ADMIN_SESSION_SECRET: ${TABLO_ADMIN_SESSION_SECRET:?TABLO_ADMIN_SESSION_SECRET را در .env مقدار بدهید — رانبوک بند ۱.۴}
      # انبار عکس شاخص پست، آروان‌کلود S3-سازگار (بلیت ۲۴) — رانبوک بند ۱.۴.
      # بدون این‌ها requiredEnv در image-store.ts پرتاب می‌کند و آپلود عکس
      # با ۵۰۲ شکست می‌خورد؛ فقط REGION در کد پیش‌فرض دارد، بقیه اجباری‌اند.
      TABLO_ARVAN_S3_ENDPOINT: ${TABLO_ARVAN_S3_ENDPOINT:?TABLO_ARVAN_S3_ENDPOINT را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_REGION: ${TABLO_ARVAN_S3_REGION:-default}
      TABLO_ARVAN_S3_BUCKET: ${TABLO_ARVAN_S3_BUCKET:?TABLO_ARVAN_S3_BUCKET را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_ACCESS_KEY: ${TABLO_ARVAN_S3_ACCESS_KEY:?TABLO_ARVAN_S3_ACCESS_KEY را در .env مقدار بدهید — رانبوک بند ۱.۴}
      TABLO_ARVAN_S3_SECRET_KEY: ${TABLO_ARVAN_S3_SECRET_KEY:?TABLO_ARVAN_S3_SECRET_KEY را در .env مقدار بدهید — رانبوک بند ۱.۴}
    # فقط loopback میزبان — برای راستی‌آزمایی از خود سرور (curl 127.0.0.1:3300).
    # مظنه ۸۰/۴۴۳ را نمی‌گیرد؛ ترافیک واقعی از کدیِ لبه روی شبکه‌ی tablo-edge
    # می‌آید، نه از این درگاه. (اتصال کدی به loopback میزبان از داخل کانتینر
    # ممکن نیست — به همین دلیل شبکه‌ی خارجی مشترک لازم است؛ رانبوک، گام کدی.)
    ports:
      - "127.0.0.1:${TABLO_WEB_PORT:-3300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # ۳۸۴M ← ۲۵۶M: لایه‌ی وب دیگر نکست نیست، اپ TanStack Start + Nitro
          # است و خروجی ‎.output‎ سبک‌تر بالا می‌آید. اندازه‌گیری واقعی روی همین
          # ایمیج: ۳۱MB بی‌کار، ۶۱MB پس از ۲۰۰ درخواست SSR.
          # جفتِ این عدد ‎NODE_OPTIONS=--max-old-space-size=192‎ در
          # Dockerfile.web است — هر کدام عوض شد، دیگری هم باید عوض شود.
          memory: 256M

networks:
  internal:
    driver: bridge
  # شبکه‌ی مشترک با کدیِ لبه‌ی پادل‌یار؛ باید قبل از up ساخته و کانتینر کدی به
  # آن وصل شده باشد:
  #   docker network create tablo-edge
  #   docker network connect tablo-edge <نام کانتینر کدی پادل‌یار>
  edge:
    external: true
    name: tablo-edge

volumes:
  # ⚠️ نام واقعی volume عمداً «mazane_mazane-postgres-data» پین شده — همان
  # چیزی که پیش از تغییر نام پروژه (۲۰۲۶-۰۸-۱۰) ساخته شده بود. بدون این پین،
  # عوض‌شدن `name:` پروژه داکر را به سراغ volumeِ **تازه و خالی** می‌فرستد و
  # دیتابیس تولید انگار پاک شده به نظر می‌رسد.
  #
  # پیش از نخستین استقرار پس از تغییر نام، این را روی سرور راستی‌آزمایی کنید:
  #   docker volume ls | grep postgres-data
  # اگر نام واقعی چیز دیگری بود، همین‌جا اصلاحش کنید — نه اینکه پین را بردارید.
  postgres-data:
    name: mazane_mazane-postgres-data
