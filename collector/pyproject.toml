[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mazane-collector"
version = "0.1.0"
description = "گردآورنده‌ی مظنه آنلاین — آداپترها، نرمال‌سازی و ذخیره‌ی قیمت مؤثر"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "asyncpg>=0.30",
    "redis>=5.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[project.scripts]
mazane-collector = "mazane_collector.main:main"
# بلیت ۱۳ — خط لوله‌ی محتوا: صف کردن دستی پیش‌نویس و پس‌گیری تک‌فرمانی.
mazane-enqueue = "mazane_collector.content.queue:main"
mazane-retract = "mazane_collector.content.retract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
